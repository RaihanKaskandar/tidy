<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f8" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#0f0f13" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tidy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply a saved light/dark choice before the first paint, so there is no flash.
      try {
        var t = localStorage.getItem('tidy.theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.media = m.dataset.scheme === t ? 'all' : 'not all'
          })
        }
        if (localStorage.getItem('tidy.look') === 'glass')
          document.documentElement.setAttribute('data-look', 'glass')
      } catch (e) {}
      // iOS Safari ignores user-scalable=no, so pinch zooming is blocked here.
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault()
      })
    </script>
    <title>Tidy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
